name: Sync with Upstream

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v5
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/jackyzha0/quartz.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream v5

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/v5)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          if [ "$BEHIND" -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge on a sync branch
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set +e
          # Never merge straight into the deployed branch: do it on a throwaway
          # branch and open a PR so a human reviews upstream changes first.
          BRANCH="sync/upstream-$(date -u +%Y%m%d-%H%M)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"
          git merge upstream/v5 --no-edit --no-ff
          MERGE_EXIT=$?

          if [ "$MERGE_EXIT" -ne 0 ]; then
            echo "Merge had conflicts, attempting auto-resolution for known files..."

            # Upstream migrated plugins to npm — drop the legacy git lockfile.
            if git diff --name-only --diff-filter=U | grep -qx "quartz.lock.json"; then
              git rm -f quartz.lock.json 2>/dev/null || git add quartz.lock.json
              echo "Resolved quartz.lock.json (accepted upstream deletion)"
            fi

            # package-lock.json conflicts are resolved by taking upstream's version.
            if git diff --name-only --diff-filter=U | grep -qx "package-lock.json"; then
              git checkout --theirs package-lock.json
              npm install
              git add package-lock.json
              echo "Resolved package-lock.json (accepted upstream + npm install)"
            fi

            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING" ]; then
              echo "merge_failed=true" >> $GITHUB_OUTPUT
              {
                echo "conflict_files<<EOF"
                echo "$REMAINING"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            else
              git commit --no-edit
              echo "Auto-resolved all known conflicts and completed merge"
            fi
          fi
          set -e

      - name: Abort failed merge
        if: steps.merge.outputs.merge_failed == 'true'
        run: |
          git merge --abort || true
          git checkout v5 || true

      - name: Push sync branch
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_failed != 'true'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          git push origin "$BRANCH"
          echo "Pushed $BRANCH"

      - name: Open pull request for review
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          gh pr create \
            --base v5 \
            --head "$BRANCH" \
            --title "chore: sync with upstream (jackyzha0/quartz)" \
            --body "ادغام خودکار $BEHIND کامیت جدید از upstream انجام شد.

          این PR خودکار ساخته شده و **باید قبل از merge بازبینی شود** — به‌خصوص
          \`quartz.config.yaml\`، \`theme/\`، \`plugins/\` و \`quartz/styles/custom.scss\`." \
          || gh pr list --head "$BRANCH" --json url --jq '.[0].url'

      - name: Create issue for merge conflict
        if: steps.merge.outputs.merge_failed == 'true'
        uses: actions/github-script@v7
        env:
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        with:
          script: |
            const title = '🔄 Sync Failed: Merge Conflicts with Upstream';
            // Read via process.env (never interpolate untrusted values into the script body).
            const conflictFiles = process.env.CONFLICT_FILES || '(unknown)';
            const body = `## Automatic sync failed

            The daily sync with upstream (jackyzha0/quartz) failed due to merge conflicts.

            ### Details
            - **Date:** ${new Date().toISOString()}
            - **Branch:** v5
            - **Upstream Branch:** jackyzha0/quartz:v5

            ### Files with conflicts
            \`\`\`
            ${conflictFiles}
            \`\`\`

            ### How to resolve
            1. Pull the latest changes locally:
               \`\`\`bash
               git fetch upstream
               git checkout v5
               git merge upstream/v5
               # Resolve conflicts manually (watch quartz.config.yaml, theme/, plugins/, custom.scss)
               git add .
               git commit -m "Merge upstream v5: resolved conflicts"
               git push origin v5
               \`\`\`
            2. Or manually sync via GitHub's "Sync fork" button and resolve conflicts there.

            ### Next Steps
            - [ ] Resolve merge conflicts
            - [ ] Push resolved changes
            - [ ] Close this issue once sync is complete

            ---
            *This issue was automatically created by the sync workflow.*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sync-conflict', 'automated']
              });
              console.log('Created issue for merge conflict');
            } else {
              console.log('Issue already exists:', existingIssue.html_url);
            }

      - name: Fail workflow if merge failed
        if: steps.merge.outputs.merge_failed == 'true'
        run: |
          echo "Merge conflicts detected. Issue created."
          exit 1
