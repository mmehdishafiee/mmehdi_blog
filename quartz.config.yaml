# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "میم"
  pageTitleSuffix: " – وبلاگ شخصی محمد مهدی شفیعی"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: fa-IR
  baseUrl: blog.mmehdi.ir
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Ray-ExtraBold
      body: Vazirmatn
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#f0e6f5"
        gray: "#6e6e6e"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#5b2f84"
        tertiary: "#b43eb6"
        highlight: rgba(180, 62, 182, 0.12)
        textHighlight: "#e7f6ff"
      darkMode:
        light: "#1c1424"
        lightgray: "#352845"
        gray: "#8a8a8a"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#c46aa9"
        tertiary: "#e08fd0"
        highlight: rgba(196, 106, 169, 0.15)
        textHighlight: "#5b2f8455"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableTweetEmbed: true
      enableVideoEmbed: true
      enableCheckbox: false
      enableObsidianUri: true
    order: 30
  - source: ./plugins/bidi-text
    enabled: true
    order: 35
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    options:
      bibliographyFile: ./bibliography.bib
      suppressBibliography: false
      linkCitations: false
      csl: apa
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: googleFonts
      body: Vazirmatn
      header: Ray-ExtraBold
      interface: Vazirmatn
      code: IBM Plex Mono
  # The "things" theme layer re-declares --secondary/--tertiary/--gray after the
  # base layer and silently overwrites configuration.theme.colors. Keep it off.
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: things
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: "@quartz-community/graph"
    enabled: false
  - source: ./quartz/plugins/graph-local
    enabled: true
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 30
      display: desktop-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
      display: desktop-only
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
      display: mobile-only
  - source: ./quartz/plugins/featured-cards
    enabled: true
    layout:
      position: beforeBody
      priority: 7
  - source: ./quartz/plugins/featured-image
    enabled: true
    layout:
      position: beforeBody
      priority: 22
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: ./quartz/plugins/page-title
    enabled: true
    layout:
      position: left
      priority: 5
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 20
      display: desktop-only
      group: toggles
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 20
      display: mobile-only
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 25
      display: desktop-only
      group: toggles
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: ./quartz/plugins/ziscus-comments
    enabled: true
    options:
      endpoint: https://ziscus-comments.lumg.workers.dev
      timeoutMs: 15000
    order: 100
  - source: ./quartz/plugins/ziscus-ui
    enabled: true
    options:
      endpoint: https://ziscus-comments.lumg.workers.dev
      title: "نظرات"
      emptyText: "هنوز نظری ثبت نشده. اولین نفری باشید که نظر میدهد."
    order: 110
    layout:
      position: afterBody
      priority: 40
  # No layout block: the manifest declares defaultPosition "footer".
  - source: ./quartz/plugins/footer
    enabled: true
    options:
      links:
        Telegram: https://t.me/Mmehdi_ir
        GitHub: https://github.com/mmehdishafiee/mmehdi_blog
      aboutUrl: برگه‌ها/about
  # Superseded by @quartz-community/recent-notes, which now ships the
  # hideTagPages/hideFolderPages options that made this fork necessary.
  - source: ./quartz/plugins/recent-posts
    enabled: false
    options:
      title: "آخرین نوشتهها"
      limit: 5
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: "آخرین نوشتهها"
      limit: 3
      linkToMore: false
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: right
      priority: 25
      display: desktop-only
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - date
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toggles:
      priority: 20
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - "@quartz-community/explorer"
    folder:
      exclude:
        - "@quartz-community/reader-mode"
      positions:
        right: []
    tag:
      exclude:
        - "@quartz-community/reader-mode"
      positions:
        right: []
    canvas: {}
    bases: {}
